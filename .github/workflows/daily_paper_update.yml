name: Daily Paper Update

on:
  # 매일 오전 7시(KST)에 자동 실행
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-paper-update
  cancel-in-progress: false

# Each job opts into only the repository permissions it needs.
permissions: {}

jobs:
  generate:
    name: Generate paper data
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Generate paper data
        run: python update_papers.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Upload generated paper data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-paper-data-${{ github.run_id }}
          path: _data/
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit generated paper data
    needs: generate
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download generated paper data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: daily-paper-data-${{ github.run_id }}
          path: _data

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- _data

          if git diff --cached --quiet; then
            echo "No paper data changes to commit."
            exit 0
          fi

          git commit -m "Auto-update: Papers for $(date +'%Y-%m-%d')"
          git push origin HEAD:main
