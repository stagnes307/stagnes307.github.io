<title>2-3-2-3. 가설검정 · 빅데이터분석기사 필기 · CC</title>
<style>
:root{color-scheme:light;--ink:#17201d;--muted:#68736e;--line:#dce3df;--paper:#fff;--accent:#315d46;--soft:#eff4f1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--soft);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
.skip-link{position:fixed;left:12px;top:-80px;z-index:10;background:#111;color:#fff;padding:10px 14px;border-radius:8px}
.skip-link:focus{top:12px}
.cc-toolbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;max-height:180px;overflow:hidden;padding:10px clamp(10px,3vw,22px);background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 3px 14px rgba(23,32,29,.08);z-index:3;transition:max-height .18s ease,padding .18s ease}
.cc-toolbar-groups{display:contents}
.cc-identity{display:flex;align-items:center;gap:10px;min-width:0}
.cc-identity strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.cc-toolbar a{color:inherit}
.cc-nav{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.cc-nav-button{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:13px;font-weight:800;text-decoration:none;white-space:nowrap}
.cc-nav-button:hover,.cc-nav-button:focus-visible{border-color:var(--accent);outline:3px solid rgba(49,93,70,.18);outline-offset:1px}
.cc-nav-button.next{background:var(--accent);border-color:var(--accent);color:#fff}
.cc-nav-button.disabled{color:var(--muted);background:var(--soft);opacity:.55}
.cc-compact-label,.cc-toolbar-toggle{display:none}
.cc-stage{position:relative;min-height:0}
.cc-stage iframe{position:relative;z-index:1;display:block;width:100%;height:100%;border:0;background:#fff}
.cc-page-next{position:absolute;right:clamp(12px,3vw,28px);bottom:clamp(12px,3vw,24px);z-index:2;min-height:48px;padding:11px 18px;font-size:14px;box-shadow:0 10px 30px rgba(23,32,29,.24)}
.cc-page-next.disabled{pointer-events:none}
@media(max-width:680px){
  .cc-toolbar{align-items:stretch;flex-direction:column;padding:8px 10px;max-height:132px}
  .cc-identity{padding-right:36px}
  .cc-identity strong{font-size:13px}
  .cc-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .cc-nav-button{padding:7px 5px;font-size:12px}
  .cc-toolbar-toggle{position:absolute;right:8px;top:8px;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
  .cc-toolbar-toggle:focus-visible{outline:3px solid rgba(49,93,70,.18);outline-offset:1px}
  .cc-toolbar-toggle-icon{display:block;transition:transform .18s ease}
  .cc-page-next{right:12px;bottom:12px;min-height:44px;padding:9px 14px;font-size:13px}
  body.toolbar-compact{grid-template-rows:40px minmax(0,1fr)}
  body.toolbar-compact .cc-toolbar{display:flex;align-items:center;justify-content:flex-start;max-height:40px;padding:4px 48px 4px 10px}
  body.toolbar-compact .cc-toolbar-groups{display:none}
  body.toolbar-compact .cc-compact-label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px;font-weight:800}
  body.toolbar-compact .cc-toolbar-toggle{top:4px}
  body.toolbar-compact .cc-toolbar-toggle-icon{transform:rotate(180deg)}
}
@media print{body{display:block}.cc-toolbar,.cc-page-next{display:none}.cc-stage iframe{height:100vh}}
</style>
<script defer src="/study/assets/cc-viewer.js?v=mobile-collapse-1"></script>
</head>
<body>

    <nav class="cc-nav" aria-label="CC 레슨 이동"><a class="cc-nav-button previous" href="/study/courses/big-data-analysis-engineer-written/lessons/2-3-2-2-interval-estimation/cc-view.html">← 이전 장</a><a class="cc-nav-button" href="/study/courses/big-data-analysis-engineer-written/">Course 목차</a><a class="cc-nav-button next" href="/study/courses/big-data-analysis-engineer-written/lessons/3-1-1-1-analysis-model-selection/cc-view.html">다음 장 →</a></nav>

  <span class="cc-compact-label" aria-hidden="true">2-3-2-3 · CC</span>

</header>
<main id="cc-content" class="cc-stage">
  <iframe id="cc-document" title="2-3-2-3. 가설검정 CC 학습 화면" src="./cc.html" loading="eager" sandbox="allow-same-origin"></iframe>

</main>
</body>
</html>
