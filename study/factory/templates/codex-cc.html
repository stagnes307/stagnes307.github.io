<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; script-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; media-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<meta name="canvas-id" content="{{CANVAS_ID}}">
<title>{{PAGE_TITLE}}</title>
<style>
:root {
  color-scheme: light;
  --ink: #172033;
  --muted: #5d6678;
  --paper: #fffdf9;
  --surface: #ffffff;
  --line: #dce2ea;
  --navy: #17365d;
  --blue: #1d5c96;
  --teal: #087e78;
  --gold: #a96700;
  --rose: #a23b52;
  --soft-blue: #eaf3fb;
  --soft-teal: #e5f6f2;
  --soft-gold: #fff5dc;
  --soft-rose: #fff0f2;
  --shadow: 0 16px 42px rgba(23, 54, 93, .11);
  --radius: 1.15rem;
  font-family: Inter, Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.72;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: #eef2f6; }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(135deg, rgba(29, 92, 150, .08), transparent 34rem),
    linear-gradient(315deg, rgba(8, 126, 120, .06), transparent 30rem),
    var(--paper);
  overflow-wrap: anywhere;
}
a { color: var(--blue); text-underline-offset: .2em; }
a:focus-visible, summary:focus-visible {
  outline: 3px solid #f2a900;
  outline-offset: 4px;
  border-radius: .25rem;
}
.skip-link {
  position: fixed;
  z-index: 20;
  inset: .75rem auto auto .75rem;
  padding: .65rem .9rem;
  color: white;
  background: var(--navy);
  border-radius: .5rem;
  transform: translateY(-180%);
}
.skip-link:focus { transform: translateY(0); }
.hero {
  position: relative;
  padding: clamp(2.2rem, 6vw, 5rem) max(1rem, calc((100vw - 72rem) / 2));
  color: white;
  background:
    radial-gradient(circle at 90% 12%, rgba(255,255,255,.16), transparent 15rem),
    linear-gradient(125deg, #142d4c, #184f72 52%, #087e78);
  border-block-end: .45rem solid #f2b544;
}
.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 4rem;
  background: linear-gradient(transparent, rgba(0,0,0,.12));
  pointer-events: none;
}
.hero-inner { position: relative; z-index: 1; max-width: 72rem; margin: auto; }
.eyebrow {
  margin: 0 0 .75rem;
  color: #c8f6ef;
  font-size: .82rem;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
}
h1 {
  max-width: 55rem;
  margin: 0;
  font-size: clamp(2rem, 5.2vw, 4.2rem);
  line-height: 1.13;
  letter-spacing: -.035em;
}
.hero-context {
  max-width: 52rem;
  margin: 1rem 0 0;
  color: #e7f3ff;
  font-size: 1.02rem;
}
.topic-list {
  display: flex;
  flex-wrap: wrap;
  gap: .55rem;
  padding: 0;
  margin: 1.4rem 0 0;
  list-style: none;
}
.topic-list li {
  padding: .42rem .78rem;
  color: #102943;
  background: #f7dd91;
  border: 1px solid rgba(255,255,255,.65);
  border-radius: 999px;
  font-size: .88rem;
  font-weight: 800;
}
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 1.25rem;
  width: min(72rem, calc(100% - 2rem));
  margin: clamp(1.2rem, 4vw, 3rem) auto 4rem;
}
.flow-card, .intro-card, .lesson-card {
  background: rgba(255,255,255,.96);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.flow-card {
  display: grid;
  grid-template-columns: minmax(11rem, .35fr) minmax(0, 1fr);
  gap: 1.2rem;
  padding: clamp(1.1rem, 3vw, 1.8rem);
  border-top: .35rem solid var(--teal);
}
.flow-card h2 { margin: 0; color: var(--navy); font-size: 1.35rem; }
.flow-card p { margin: .35rem 0 0; color: var(--muted); font-size: .93rem; }
.toc {
  align-self: center;
  padding: 0;
  margin: 0;
  columns: 2 15rem;
  list-style: none;
}
.toc li { break-inside: avoid; margin: 0 0 .45rem; }
.toc a {
  display: inline-flex;
  gap: .45rem;
  color: var(--ink);
  font-weight: 700;
  text-decoration-thickness: .08rem;
}
.toc b { color: var(--teal); font-variant-numeric: tabular-nums; }
.intro-card { padding: clamp(1.2rem, 4vw, 2.2rem); border-left: .38rem solid var(--gold); }
.source-heading {
  display: inline-flex;
  flex-wrap: wrap;
  gap: .5rem;
  margin: 0 0 1rem;
  padding: .55rem .8rem;
  color: var(--navy);
  background: var(--soft-blue);
  border-radius: .55rem;
  font-weight: 800;
}
.source-heading small { color: var(--blue); font-size: .72rem; letter-spacing: .05em; }
.lesson-card { overflow: clip; }
.lesson-card > header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: .8rem;
  padding: 1.15rem clamp(1.1rem, 4vw, 2rem);
  color: white;
  background: linear-gradient(115deg, var(--navy), var(--blue));
}
.lesson-card:nth-of-type(4n+2) > header { background: linear-gradient(115deg, #075c59, var(--teal)); }
.lesson-card:nth-of-type(4n+3) > header { background: linear-gradient(115deg, #70470a, var(--gold)); }
.lesson-card:nth-of-type(4n) > header { background: linear-gradient(115deg, #713143, var(--rose)); }
.lesson-card.is-check > header { background: linear-gradient(115deg, #6c2941, #ad3f5b); }
.lesson-card.is-summary > header { background: linear-gradient(115deg, #07584f, #0b8579); }
.section-number {
  display: grid;
  place-items: center;
  width: 2.55rem;
  height: 2.55rem;
  color: var(--navy);
  background: white;
  border-radius: 50%;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
}
.lesson-card h2 { margin: 0; font-size: clamp(1.3rem, 3vw, 1.8rem); line-height: 1.3; }
.card-body { padding: clamp(1.2rem, 4vw, 2.2rem); }
.card-body > :first-child { margin-top: 0; }
.card-body > :last-child { margin-bottom: 0; }
h2, h3 { text-wrap: balance; }
h3 {
  margin: 2rem 0 .65rem;
  padding-bottom: .38rem;
  color: var(--navy);
  border-bottom: 2px solid var(--soft-blue);
  font-size: 1.2rem;
}
p { margin: .7rem 0 1rem; }
strong { color: #102f52; }
em { color: #6b3e00; }
ul, ol { padding-inline-start: 1.4rem; }
li { margin: .35rem 0; }
.markdown-list > li { margin-inline-start: calc(var(--depth, 0) * 1.1rem); }
blockquote {
  margin: 1.2rem 0;
  padding: .9rem 1.1rem;
  color: #30435a;
  background: var(--soft-blue);
  border-inline-start: .32rem solid var(--blue);
  border-radius: 0 .65rem .65rem 0;
}
blockquote p { margin: 0; }
hr { height: 1px; margin: 2rem 0; background: var(--line); border: 0; }
code {
  padding: .1em .34em;
  color: #74370d;
  background: #fff2dd;
  border: 1px solid #f0d6ae;
  border-radius: .3rem;
  font-family: "Cascadia Code", Consolas, monospace;
  font-size: .88em;
}
.code-block {
  margin: 1.2rem 0;
  overflow: hidden;
  background: #111b2b;
  border: 1px solid #31445f;
  border-radius: .8rem;
}
.code-label {
  margin: 0;
  padding: .45rem .8rem;
  color: #bcd4ef;
  background: #1b2b40;
  font: 700 .74rem/1.4 system-ui, sans-serif;
  letter-spacing: .04em;
}
pre {
  max-width: 100%;
  margin: 0;
  padding: 1rem;
  overflow: auto;
  color: #edf5ff;
  white-space: pre;
  tab-size: 4;
}
pre code {
  padding: 0;
  color: inherit;
  background: transparent;
  border: 0;
  font-size: .84rem;
}
.table-wrap { max-width: 100%; margin: 1.3rem 0; overflow-x: auto; border: 1px solid var(--line); border-radius: .75rem; }
table { width: 100%; border-collapse: collapse; min-width: 32rem; background: white; }
caption {
  padding: .7rem .85rem;
  color: white;
  background: var(--navy);
  font-weight: 800;
  text-align: left;
}
th, td { padding: .68rem .78rem; border: 1px solid var(--line); vertical-align: top; text-align: left; }
thead th { color: #12385c; background: var(--soft-blue); }
tbody th { color: #164a47; background: var(--soft-teal); }
.align-center { text-align: center; }
.align-right { text-align: right; }
.reveal {
  margin: 1.1rem 0;
  border: 1px solid #d9bd77;
  border-radius: .75rem;
  background: #fffaf0;
}
.reveal summary {
  padding: .78rem 1rem;
  color: #684406;
  cursor: pointer;
  font-weight: 850;
}
.reveal-content { padding: .2rem 1rem 1rem; }
.nonactive-reference, .blocked-image {
  display: inline-flex;
  flex-wrap: wrap;
  gap: .35rem;
  padding: .08rem .35rem;
  background: #f1f3f6;
  border: 1px dashed #aab3c0;
  border-radius: .35rem;
}
.literal-address { color: var(--muted); font-family: monospace; font-size: .78em; }
.depth-label { color: var(--muted); font-size: .78em; }
.page-footer {
  padding: 1.2rem;
  color: #d9e8f5;
  background: #142d4c;
  text-align: center;
  font-size: .84rem;
}
@media (max-width: 44rem) {
  :root { font-size: 16px; }
  .hero { padding-inline: 1rem; }
  .layout { width: min(100% - 1rem, 72rem); }
  .flow-card { grid-template-columns: 1fr; }
  .toc { columns: 1; }
  .lesson-card > header { align-items: start; }
  .card-body { padding-inline: 1rem; }
  table { min-width: 27rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .001ms !important;
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
  }
}
@media print {
  :root { font-size: 10.5pt; }
  html, body { background: white; }
  .skip-link { display: none; }
  .hero {
    padding: 1.2rem 0;
    color: black;
    background: white;
    border-bottom: 3px solid black;
  }
  .hero-context, .eyebrow { color: #333; }
  .layout { display: block; width: 100%; margin: 1rem 0; }
  .flow-card, .intro-card, .lesson-card { margin: 0 0 1rem; box-shadow: none; break-inside: avoid; }
  .lesson-card > header, caption { color: black; background: #e8edf2 !important; }
  .section-number { border: 1px solid black; }
  .code-block, pre { color: black; background: #f3f3f3; }
  a { color: black; text-decoration: none; }
}
</style>
</head>
<body>
<a class="skip-link" href="#ai-content-placeholder">본문 바로가기</a>
<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">{{COURSE_TITLE}} · {{SECTION_LABEL}}</p>
    <h1>{{LESSON_ID}}. {{LESSON_TITLE}}</h1>
    <p class="hero-context">{{GROUP_LABEL}}의 학습 범위를 FF 원문 순서대로 재구성한 정적 시각 교안입니다.</p>
    <ul class="topic-list" aria-label="학습 토픽">{{TOPICS}}</ul>
  </div>
</header>
<main id="ai-content-placeholder" class="layout">
  <section class="flow-card" aria-labelledby="learning-flow-title">
    <div>
      <h2 id="learning-flow-title">학습 흐름</h2>
      <p>목차를 따라 정의에서 적용, 확인 문제와 요약까지 순서대로 학습하세요.</p>
    </div>
    <nav aria-label="FF 학습 목차">
      <ol class="toc">{{TOC}}</ol>
    </nav>
  </section>
  {{INTRO}}
  {{SECTIONS}}
</main>
<footer class="page-footer">Study Factory · FF 전체 내용 기반 정적 CC</footer>
</body>
</html>
