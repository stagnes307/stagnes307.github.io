<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{PAGE_TITLE}}</title>
<link rel="stylesheet" href="/study/assets/study-factory.css">
</head>
<body class="course-page">
<header class="topbar"><a href="/study/">Study Library</a><a href="/">홈</a></header>
<main class="course-wrap">
  <header class="course-hero"><p class="eyebrow">CERTIFICATION COURSE</p><h1>{{COURSE_TITLE}}</h1><p>{{COURSE_DESCRIPTION}}</p>
    <div class="progress-summary"><strong>{{COMPLETED}} / {{TOTAL}} 완료</strong><span>{{PERCENT}}%</span></div>
    <div class="progress-track"><i style="width:{{PERCENT}}%"></i></div>
  </header>
  {{QUESTION_BANK_CTA}}
  <div class="legend"><span>✓ published</span><span>◐ processing</span><span>! failed</span><span>○ pending</span></div>
  <div class="course-outline">{{COURSE_OUTLINE}}</div>
</main>
</body>
</html>
